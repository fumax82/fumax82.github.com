# Compila l'app Android "VideoTutorial" e pubblica l'APK installabile.
#
# Parte da sola a ogni modifica della cartella VideoTutorial/, oppure a mano
# da GitHub: scheda "Actions" > "Compila APK VideoTutorial" > "Run workflow".
# L'APK si scarica dalla pagina "Releases" del repository.

name: Compila APK VideoTutorial

on:
  push:
    paths:
      - "VideoTutorial/**"
      - ".github/workflows/compila-apk-videotutorial.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compila:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VideoTutorial
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      # Chiave di firma facoltativa, salvata nei Secrets del repository
      # (Settings > Secrets and variables > Actions). Vedi LEGGIMI.md.
      - name: Prepara la chiave di firma (se presente)
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_FILE=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Chiave di firma trovata."
          else
            echo "Nessuna chiave nei Secrets: si usa la chiave di debug."
          fi

      - name: Compila l'APK
        env:
          FIRMA_PASSWORD: ${{ secrets.FIRMA_PASSWORD }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk VideoTutorial.apk

      - name: Salva l'APK tra i risultati della compilazione
        uses: actions/upload-artifact@v4
        with:
          name: VideoTutorial-apk
          path: VideoTutorial/VideoTutorial.apk

      - name: Pubblica l'APK nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: videotutorial-build-${{ github.run_number }}
          name: VideoTutorial (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: VideoTutorial/VideoTutorial.apk
          body: |
            APK installabile dell'app VideoTutorial.
            Sul telefono: scarica VideoTutorial.apk, aprilo e consenti l'installazione da questa fonte.
