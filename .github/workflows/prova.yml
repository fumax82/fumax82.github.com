name: Prova
on:
  push:
    branches: [navigatore-sorgenti]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          G=https://dl.google.com/dl/android/maven2
          v() { curl -s "$1" | grep -oE '<(release|latest)>[^<]*' | tr '\n' ' '; echo; }
          {
          echo "AGP: $(v $G/com/android/tools/build/gradle/maven-metadata.xml)"
          echo "AGP all: $(curl -s $G/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -8 | tr '\n' ' ')"
          echo "BOM: $(curl -s $G/androidx/compose/compose-bom/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -5 | tr '\n' ' ')"
          echo "activity-compose: $(curl -s $G/androidx/activity/activity-compose/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -3 | tr '\n' ' ')"
          echo "lifecycle: $(curl -s $G/androidx/lifecycle/lifecycle-viewmodel-compose/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -3 | tr '\n' ' ')"
          echo "core-ktx: $(curl -s $G/androidx/core/core-ktx/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -3 | tr '\n' ' ')"
          echo "material3: $(curl -s $G/androidx/compose/material3/material3/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -3 | tr '\n' ' ')"
          echo "icons-ext: $(curl -s $G/androidx/compose/material/material-icons-extended/maven-metadata.xml | grep -oE '<version>[0-9.]+</version>' | tail -3 | tr '\n' ' ')"
          echo "gradle: $(curl -s https://services.gradle.org/versions/current | head -c 300)"
          ls /dev/kvm && echo KVM-SI || echo KVM-NO
          nproc; free -g | head -2
          } > esito.txt 2>&1
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add esito.txt; git commit -m "esito [skip ci]"; git push
