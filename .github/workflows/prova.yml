name: Prova
on:
  push:
    branches: [navigatore-sorgenti]
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls /dev/kvm || true; java -version; echo $ANDROID_HOME; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools || true
          echo "ok $(date)" > esito.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add esito.txt; git commit -m "esito [skip ci]"; git push
