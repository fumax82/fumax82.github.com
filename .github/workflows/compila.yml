# Compila l'app, esegue le prove e salva i risultati nel ramo stesso
# (cartella risultati/). Nessuna chiave o segreto viene usato.
name: Compila e prova
on:
  push:
    branches: [navigatore-sorgenti]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compila:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prove del nucleo (simulazioni)
        run: |
          set -o pipefail
          mkdir -p risultati
          chmod +x gradlew
          ./gradlew --no-daemon -p nucleo test 2>&1 | tee risultati/prove_nucleo.log
      - name: Compilazione APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee risultati/compilazione.log
          cp app/build/outputs/apk/release/*.apk risultati/Navigatore-non-firmato.apk
      - name: Controllo dei servizi di mappe gratuiti
        run: |
          {
          for u in \
            "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/10/361/543.jpg" \
            "https://a.tile.opentopomap.org/10/543/361.png" \
            "https://tiles.openfreemap.org/planet" \
            "https://tiles.openfreemap.org/fonts/Noto%20Sans%20Regular/0-255.pbf" \
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/10/361/543" ; do
            echo "$(curl -s -o /dev/null -A 'Navigatore-personale/prova' -w '%{http_code} %{content_type} %{size_download}B' "$u") $u"
          done
          } | tee risultati/servizi_mappe.txt
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prova sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.ric.navigatore.test/androidx.test.runner.AndroidJUnitRunner > risultati/emulatore.log 2>&1 || echo FALLITO >> risultati/emulatore.log
            mkdir -p risultati/foto && adb pull /sdcard/Android/data/com.ric.navigatore/files/foto/. risultati/foto/ || true
            adb logcat -d > risultati/logcat.txt || true
      - name: Salva i risultati nel ramo
        if: always()
        run: |
          mkdir -p risultati
          cp -r app/build/outputs/androidTest-results risultati/ 2>/dev/null || true
          cp -r app/build/reports/androidTests risultati/ 2>/dev/null || true
          cp -r nucleo/build/test-results/test risultati/prove_nucleo_xml 2>/dev/null || true
          date -u > risultati/data.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f risultati
          git commit -m "risultati [skip ci]" || true
          git push
